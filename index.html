<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPEED CLICK</title>
<style>
body {
 background:#080d1b;
 color:white;
 font-family:Arial;
 text-align:center;
 padding:25px;
}
h1 {color:#35c8ff;font-size:32px}
.card {
 background:#142139;
 padding:25px;
 border-radius:20px;
 margin-top:25px;
}
button {
 padding:15px 30px;
 border:0;
 border-radius:12px;
 margin:10px;
 font-size:18px;
}
#start {background:#35c8ff}
#stop {background:#34445f;color:white}
#count {font-size:50px}
</style>
</head>
<body>
<h1>⚡ SPEED CLICK</h1>
<div class="card">
<p>عداد النقرات التجريبي</p>
<div id="count">0</div>
<button id="start" onclick="start()">START</button>
<button id="stop" onclick="stop()">STOP</button>
</div>
<script>
let count=0, timer;
function start(){
 if(timer)return;
 timer=setInterval(()=>{
 count++;
 document.getElementById('count').innerText=count;
 },200);
}
function stop(){
 clearInterval(timer);
 timer=null;
}
</script>
</body>
</html>
